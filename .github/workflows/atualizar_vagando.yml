name: Atualização diária do Vagando

on:
  workflow_dispatch:
  schedule:
    # 10h UTC = 7h no horário de Brasília (UTC-3)
    - cron: "0 10 * * *"

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Coletar e classificar oportunidades
      env:
          HIMALAYAS_API_KEY: ${{ secrets.HIMALAYAS_API_KEY }}
        run: python scripts/coletar_vagas.py
      - name: Salvar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || git commit -m "atualiza oportunidades do radar"
          git push
